<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brakelight</title>
    <script src="/htmx.min.js"></script>
    <script src="/sse.js"></script>
    <script>
        document.addEventListener('htmx:sseMessage', function () {
            var el = document.querySelector('#encode-progress [data-title]');
            document.title = el ? el.getAttribute('data-title') : 'Brakelight';
        });
        function closeLogModal() {
            document.getElementById('log-modal').hidden = true;
        }
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('log-modal-close').addEventListener('click', closeLogModal);
            document.getElementById('log-modal').addEventListener('click', function (e) {
                if (e.target === this) closeLogModal();
            });
        });
        document.addEventListener('keydown', function (e) {
            if (e.key === 'Escape') closeLogModal();
        });
        function closeTracksModal() {
            document.getElementById('tracks-modal').hidden = true;
        }
        document.addEventListener('DOMContentLoaded', function () {
            var tm = document.getElementById('tracks-modal');
            document.getElementById('tracks-modal-close').addEventListener('click', closeTracksModal);
            tm.addEventListener('click', function (e) {
                if (e.target === this) closeTracksModal();
            });
            document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape' && !tm.hidden) closeTracksModal();
            });
        });
        // checkedIds tracks which review-job checkboxes are selected so the
        // selection survives the periodic queue refresh (htmx swaps the table
        // rows; the checkboxes themselves are not preserved).
        var checkedIds = {};
        function syncCheckedIds() {
            checkedIds = {};
            document.querySelectorAll('#queue input[name="ids"]:checked').forEach(function (cb) {
                checkedIds[cb.value] = true;
            });
        }
        // restoreQueueState re-applies the checked state and the filename
        // filter after the queue fragment has been swapped in.
        function restoreQueueState() {
            var filter = document.getElementById('queue-filter');
            var q = filter ? filter.value.toLowerCase() : '';
            var next = {};
            document.querySelectorAll('#queue tr[data-file]').forEach(function (row) {
                var name = row.getAttribute('data-file').toLowerCase();
                row.style.display = (q && name.indexOf(q) === -1) ? 'none' : '';
                var cb = row.querySelector('input[name="ids"]');
                if (cb) {
                    cb.checked = !!checkedIds[cb.value];
                    if (cb.checked) next[cb.value] = true;
                }
            });
            checkedIds = next;
        }
        document.addEventListener('change', function (e) {
            if (e.target && e.target.name === 'ids') syncCheckedIds();
        });
        document.addEventListener('htmx:afterSwap', function (e) {
            if (e.target && e.target.id === 'queue') restoreQueueState();
        });
        // filterQueueRows hides pending rows whose filename does not contain
        // the given text (case-insensitive). Changing the filter invalidates
        // the "all visible" checkbox, so it is unchecked.
        function filterQueueRows(q) {
            q = q.toLowerCase();
            document.querySelectorAll('#queue tr[data-file]').forEach(function (row) {
                var name = row.getAttribute('data-file').toLowerCase();
                row.style.display = name.indexOf(q) !== -1 ? '' : 'none';
            });
            var selectAll = document.getElementById('select-all-visible');
            if (selectAll) selectAll.checked = false;
        }
        // toggleVisibleRows checks or unchecks the review checkboxes of all
        // rows currently visible under the filter.
        function toggleVisibleRows(source) {
            document.querySelectorAll('#queue tr[data-file]').forEach(function (row) {
                if (row.style.display === 'none') return;
                var cb = row.querySelector('input[name="ids"]');
                if (cb) cb.checked = source.checked;
            });
            syncCheckedIds();
        }
    </script>
    <style>
        :root {
            /* Tokyo Night */
            color-scheme: dark;
            --bg: #1a1b26;
            --surface: #24283b;
            --border: #292e42;
            --inset: #16161e;
            --text: #c0caf5;
            --muted: #565f89;
            --log-text: #a9b1d6;
            --accent: #7aa2f7;
            --success: #9ece6a;
            --error: #f7768e;
            --warn: #e0af68;
            --success-tint: rgba(158, 206, 106, 0.15);
            --error-tint: rgba(247, 118, 142, 0.15);
            --warn-tint: rgba(224, 175, 104, 0.15);
            --secondary: #414868;
            --button-text: #16161e;
        }
        @media (prefers-color-scheme: light) {
            :root {
                /* Tokyo Night Day */
                color-scheme: light;
                --bg: #e1e2e7;
                --surface: #d0d5e3;
                --border: #c4c8da;
                --inset: #d0d5e3;
                --text: #3760bf;
                --muted: #848cb5;
                --log-text: #6172b0;
                --accent: #2e7de9;
                --success: #587539;
                --error: #f52a65;
                --warn: #8c6c3e;
                --success-tint: rgba(88, 117, 53, 0.15);
                --error-tint: rgba(245, 42, 101, 0.12);
                --warn-tint: rgba(140, 108, 62, 0.12);
                --secondary: #a8aecb;
                --button-text: #ffffff;
            }
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            line-height: 1.5;
        }
        h1 { margin-top: 0; }
        .container { max-width: 1100px; margin: 0 auto; }
        .section {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 1.5rem;
        }
        .section h2 {
            margin: 0 0 1rem;
            font-size: 1.1rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th, td {
            text-align: left;
            padding: 0.6rem 0.5rem;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--muted); font-weight: 600; font-size: 0.85rem; }
        tr:last-child td { border-bottom: none; }
        .status { font-weight: 600; font-size: 0.85rem; }
        .status.pending { color: var(--warn); }
        .status.processing { color: var(--accent); }
        .status.completed { color: var(--success); }
        .status.failed { color: var(--error); }
        .filename {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .actions { display: flex; flex-wrap: wrap; gap: 0.4rem; align-items: center; }
        button {
            background: var(--accent);
            color: var(--button-text);
            border: none;
            border-radius: 4px;
            padding: 0.35rem 0.7rem;
            font-size: 0.85rem;
            cursor: pointer;
        }
        button:hover { filter: brightness(1.1); }
        button.secondary { background: var(--secondary); }
        button.danger { background: var(--error); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .service-header {
            display: flex;
            justify-content: flex-start;
            gap: 3rem;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .service-status {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.95rem;
        }
        .status-badge {
            padding: 0.25rem 0.6rem;
            border-radius: 999px;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }
        .status-badge.active { background: var(--success-tint); color: var(--success); }
        .status-badge.inactive { background: var(--error-tint); color: var(--error); }
        .status-badge.warn { background: var(--warn-tint); color: var(--warn); }
        .paused-banner {
            background: var(--error-tint);
            border: 1px solid var(--error);
            color: var(--error);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            margin-bottom: 1.5rem;
        }
        .progress-bar {
            background: var(--inset);
            border: 1px solid var(--border);
            border-radius: 4px;
            height: 14px;
            overflow: hidden;
            margin-bottom: 0.5rem;
        }
        .progress-fill {
            background: var(--accent);
            height: 100%;
            transition: width 0.8s linear;
        }
        .progress-text {
            color: var(--muted);
            font-size: 0.9rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
        .empty { color: var(--muted); padding: 1rem 0; }
        .log-output {
            background: var(--inset);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.75rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.8rem;
            max-height: 200px;
            overflow: auto;
            white-space: pre-wrap;
            color: var(--log-text);
        }
        .error-message { color: var(--error); font-size: 0.85rem; margin-top: 0.25rem; }
        .command-errors { color: var(--warn); font-size: 0.85rem; margin-top: 0.25rem; white-space: pre-wrap; }
        .size-down { color: var(--success); }
        .size-up { color: var(--error); }
        .reencode-warning { color: var(--warn); font-size: 0.85rem; }
        .drag-handle { cursor: grab; color: var(--muted); user-select: none; }
        .drag-handle:active { cursor: grabbing; }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-overlay[hidden] { display: none; }
        .modal {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            width: min(900px, 90vw);
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 1rem 1.25rem;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }
        #log-modal-title {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.95rem;
            font-weight: 600;
        }
        .modal .log-output { max-height: 60vh; }
        .bulk-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--muted);
        }
        .bulk-bar input[type="text"] {
            background: var(--inset);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            padding: 0.35rem 0.6rem;
            font-size: 0.85rem;
        }
        .bulk-bar select {
            background: var(--inset);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            padding: 0.3rem 0.4rem;
            font-size: 0.85rem;
            margin-left: 0.3rem;
        }
        .bulk-select-all { display: flex; align-items: center; gap: 0.3rem; }
        .tracks-title {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.95rem;
            margin: 0 0 1rem;
            word-break: break-all;
        }
        .track-group { margin-bottom: 1rem; }
        .track-group h4 {
            margin: 0 0 0.5rem;
            font-size: 0.85rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .track-group select {
            background: var(--inset);
            border: 1px solid var(--border);
            border-radius: 4px;
            color: var(--text);
            padding: 0.3rem 0.4rem;
            font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        .track-option {
            display: block;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.85rem;
            padding: 0.15rem 0;
        }
        .tracks-actions { display: flex; justify-content: flex-end; }
        tr.review-awaiting td { background: var(--warn-tint); }
        tr.review-awaiting td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
        tr.review-set td { background: var(--success-tint); }
        tr.review-set td:first-child { box-shadow: inset 3px 0 0 var(--success); }
    </style>
</head>
<body>
    <div class="container">
        <h1>Brakelight</h1>

        <div class="section">
            <h2>Encoding progress</h2>
            <div id="encode-progress" hx-ext="sse" sse-connect="/events" sse-swap="progress">
                <div class="empty">Idle</div>
            </div>
        </div>

        <div id="queue" hx-get="/queue" hx-trigger="load, every 5s" hx-swap="innerHTML">
            {{ template "queue.html" . }}
        </div>
    </div>

    <div id="log-modal" class="modal-overlay" hidden>
        <div class="modal">
            <div class="modal-header">
                <span id="log-modal-title">Output</span>
                <button id="log-modal-close" class="secondary">✕</button>
            </div>
            <div id="log-modal-content"></div>
        </div>
    </div>

    <div id="tracks-modal" class="modal-overlay" hidden>
        <div class="modal">
            <div class="modal-header">
                <span>Track selection</span>
                <button id="tracks-modal-close" class="secondary">✕</button>
            </div>
            <div id="tracks-modal-content"></div>
        </div>
    </div>
</body>
</html>
